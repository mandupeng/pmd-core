# Free Supabase projects pause after a period of inactivity. Ping the API every 3 days.
name: supabase-keepalive
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" -a -n "$SUPABASE_ANON_KEY" || { echo "secrets missing"; exit 1; }
          curl -fsS "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_ANON_KEY" -o /dev/null
      # GitHub disables scheduled workflows after 60 days without repo activity; this keeps it alive.
      - uses: gautamkrishnar/keepalive-workflow@v2
